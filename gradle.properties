org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Can be music, tracker or lyrics
extType=music
extId=echo_combine
extClass=CombineExtension

extIconUrl=
extName=Combine Extension
extDescription=Combine multiple extensions: metadata from one, audio from another.

extAuthor=TheWinner02
extAuthorUrl=https://github.com/TheWinner02

extRepoUrl=https://github.com/TheWinner02/echo-combine-extension
extUpdateUrl=https://api.github.com/repos/TheWinner02/echo-combine-extension/releases
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Progressive versioning variables
extVersionCode=1
extVersionName=v1.0.4